
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Money - แอปรายรับรายจ่าย</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div>
                <h1>🌷 My Money</h1>
                <p>จัดการเงินของคุณให้ง่ายขึ้น</p>
            </div>
        </header>

        <!-- Balance -->
        <section class="balance-card">
            <p>ยอดเงินคงเหลือ</p>
            <h2 id="balance">฿0.00</h2>

            <div class="summary">

                <div class="summary-item">
                    <span>💚 รายรับ</span>
                    <h3 id="income">฿0.00</h3>
                </div>

                <div class="summary-item">
                    <span>🩷 รายจ่าย</span>
                    <h3 id="expense">฿0.00</h3>
                </div>

            </div>
        </section>

        <!-- Add Transaction -->
        <section class="form-card">

            <h2>＋ เพิ่มรายการใหม่</h2>

            <form id="moneyForm">

                <label>ประเภทรายการ</label>

                <select id="type">
                    <option value="income">รายรับ</option>
                    <option value="expense">รายจ่าย</option>
                </select>

                <label>ชื่อรายการ</label>

                <input
                    type="text"
                    id="detail"
                    placeholder="เช่น เงินเดือน, ค่าอาหาร"
                    required
                >

                <label>หมวดหมู่</label>

                <select id="category">
                    <option value="เงินเดือน">เงินเดือน</option>
                    <option value="อาหาร">อาหาร</option>
                    <option value="เดินทาง">เดินทาง</option>
                    <option value="ช้อปปิ้ง">ช้อปปิ้ง</option>
                    <option value="การศึกษา">การศึกษา</option>
                    <option value="ความบันเทิง">ความบันเทิง</option>
                    <option value="อื่น ๆ">อื่น ๆ</option>
                </select>

                <label>จำนวนเงิน (บาท)</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label>วันที่</label>

                <input
                    type="date"
                    id="date"
                    required
                >

                <button type="submit">
                    บันทึกรายการ
                </button>

            </form>
        </section>

        <!-- History -->
        <section class="history-card">

            <h2>📋 ประวัติรายการ</h2>

            <div id="history">
                <p class="empty">ยังไม่มีรายการ</p>
            </div>

        </section>

        <footer>
            My Money © 2026 🌸
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
